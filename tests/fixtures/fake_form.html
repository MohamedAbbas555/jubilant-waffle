<!doctype html>
<html><body>
<form id="application">
  <div class="field"><label for="fn">First Name *</label><input id="fn" name="job_application[first_name]"></div>
  <div class="field"><label for="ln">Last Name *</label><input id="ln" name="job_application[last_name]"></div>
  <div class="field"><label for="em">Email *</label><input id="em" type="email" name="job_application[email]"></div>
  <div class="field"><label for="ph">Phone</label><input id="ph" type="tel" name="job_application[phone]"></div>
  <div class="field"><label for="li">LinkedIn Profile</label><input id="li" name="q1"></div>
  <div class="field"><label for="gh">GitHub URL</label><input id="gh" name="q2"></div>
  <div class="field"><label for="why">Why do you want to work here?</label><textarea id="why" name="q3"></textarea></div>
  <div class="field"><label for="cl_text">Cover Letter (paste)</label><textarea id="cl_text" name="cover_letter_text"></textarea></div>
  <div class="field"><label for="res">Resume/CV</label><input id="res" type="file" name="resume"></div>
  <div class="field"><label for="cl">Cover Letter</label><input id="cl" type="file" name="cover_letter"></div>
  <button type="submit">Submit Application</button>
</form>
</body></html>
